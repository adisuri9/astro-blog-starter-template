# Consumer-internet companies Scout crawls directly through their public job-board APIs.
#
# ats: greenhouse | lever | ashby | smartrecruiters | workday | none
#   none = not crawlable via a public API (Scout still finds their roles through LinkedIn/Indeed/Google
#          via the `boards` source); listing them marks them as known consumer companies.
# slug: the company's board token on that ATS (the last part of e.g. boards.greenhouse.io/<slug>).
# us_mnc: true for US multinationals whose offices abroad can lead to an L-1A transfer to the US.
#
# Slugs change when companies switch ATS. Run `scout doctor` to check them and fix or remove any that fail.

companies:
  # --- Greenhouse ---
  - {name: Airbnb, ats: greenhouse, slug: airbnb, us_mnc: true}
  - {name: DoorDash, ats: greenhouse, slug: doordashusa, us_mnc: true}
  - {name: Instacart, ats: greenhouse, slug: instacart}
