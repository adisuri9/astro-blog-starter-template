# What Scout looks for. Patterns are case-insensitive regular expressions matched against job titles.

roles:
  # A title passes if it shows seniority, in any business function...
  include:
    - '\bhead\b'                                         # Head of X, X Head, Head, X
    - '\bdirector\b'                                     # incl. Senior / Executive / Managing Director
    - '\b(vice president|s?vp|evp|avp)\b'
    - '\bpresident\b'
    - '\bchief\b'                                        # Chief X Officer, Chief of Staff
    - '\b(ceo|coo|cpo|cbo|cro|cmo|cso|cgo|cco)\b'
    - '\b(general manager|gm)\b'
    - '\b(co-?founder|founding)\b'
    - '\bcountry (manager|lead)\b'
    - '\bgroup product (manager|lead)\b'
    - '\bprincipal\b.*\bproducts?\b'                     # Amazon L7: Principal Product Manager
    - '\b(senior|sr\.?) manager\b.*\bproducts?\b'         # Amazon L7: Sr. Manager, Product Management
    - '\b(operating|venture) partner\b'
    - '\b(entrepreneur|executive) in residence\b'
  # ...unless it is junior/support or a site-operations role (always dropped)...
  exclude_always:
    - '\bintern(ship)?\b'
    - '\b(executive|administrative|personal) assistant\b'
    - '\b(executive|hr|people) business partners?\b'
    - '\b(communications|public relations)\b'
    - '\b(store|warehouse|fulfillment center|distribution center|plant|restaurant|hotel)\b'
  # ...or a function you wouldn't move into (dropped unless the title also matches `keep_if`).
  exclude:
    - '\b(engineering|engineer|software|hardware|firmware|data science|machine learning|design|ux|research|scientist)\b'
    - '\b(legal|counsel|finance|financial planning|accounting|tax|audit|treasury|investor relations)\b'
    - '\b(people|hr|human resources|recruiting|talent|security|it|facilities|creative|clinical|medical|nursing)\b'
    - '\b(cfo|cto|cio|ciso|chief (financial|technology|information|security|legal|people|medical|scientific|data) officer)\b'
  keep_if:
    - '\bproducts?\b'
    - '\b(business|strategy|strategic|general manager|gm|growth|category|categories|e-?commerce|marketplace|monetization|partnerships?|sales|commercial)\b'

# Titles that don't say "senior" but often are, in functions where a top MBA / tech profile fits. These count
# only when the posting asks for experience within `experience_years` (the functions in `exclude` still apply).
experience_titles:
  - '\bproduct (manager|lead|leader|management)\b'
  - '\b(strategy|strategic|bizops|business operations|business development|corporate development|corp dev|partnerships?|commercial|ventures?|transformation)\b'
  - '\b(category|e-?commerce|growth|marketplace|monetization|customer experience|cx|business) (manager|lead|leader|owner)\b'
  - '\b(principal|lead|staff|senior manager|sr\.? manager|group manager)\b'
experience_years: {min: 6, max: 20}

# Points by seniority for the rule-based pre-score (first match wins).
seniority:
  - {pattern: '\b(chief|ceo|coo|cpo|cbo|cro|cmo|president|co-?founder|s?vp|evp|vice president|general manager|gm|managing director|country (manager|lead))\b', points: 40}
  - {pattern: '\bhead\b', points: 38}
  - {pattern: '\b(senior|sr\.?|executive) director\b', points: 38}
  - {pattern: '\b(director|avp|founding)\b', points: 34}
  - {pattern: '\b(group product|principal|senior manager|sr\.? manager)\b', points: 28}

# Your core functions rank first: titles matching these get a bonus in the pre-score.
core_functions:
  pattern: '\b(products?|general manager|gm|business|category|categories|e-?commerce|marketplace|growth|strategy|monetization)\b'
  points: 10

# Where to look. `priority` 1 is most wanted. `boards` configures LinkedIn/Indeed/Glassdoor/Google/Naukri
# searches (via python-jobspy); `amazon_country` is the country code amazon.jobs filters by.
regions:
  - key: bay_area
    name: SF Bay Area
    priority: 1
    aliases: [san francisco, bay area, mountain view, menlo park, palo alto, sunnyvale, san jose, cupertino, redwood city, san mateo, santa clara, oakland, foster city, los gatos, burlingame]
    boards: {location: "San Francisco Bay Area", country_indeed: usa, sites: [linkedin, indeed, glassdoor, google]}
    amazon_country: USA
  - key: seattle
    name: Seattle / Bellevue
    priority: 1
    aliases: [seattle, bellevue, redmond, kirkland]
    boards: {location: "Seattle, WA", country_indeed: usa, sites: [linkedin, indeed, glassdoor, google]}
    amazon_country: USA
  - key: singapore
    name: Singapore
    priority: 1
    aliases: [singapore]
    boards: {location: "Singapore", country_indeed: singapore, sites: [linkedin, indeed, google]}
    amazon_country: SGP
  - key: new_york
    name: New York
    priority: 2
    aliases: [new york, nyc, manhattan, brooklyn]
    boards: {location: "New York, NY", country_indeed: usa, sites: [linkedin, indeed, glassdoor, google]}
    amazon_country: USA
  - key: vancouver
    name: Vancouver (bridge to Seattle)
    priority: 2
    aliases: [vancouver, burnaby, british columbia]
    boards: {location: "Vancouver, BC", country_indeed: canada, sites: [linkedin, indeed, google]}
    amazon_country: CAN
  - key: dubai
    name: Dubai
    priority: 2
    aliases: [dubai, abu dhabi, united arab emirates, uae]
    boards: {location: "Dubai", country_indeed: "united arab emirates", sites: [linkedin, indeed, google]}
  - key: toronto
    name: Toronto
    priority: 3
    aliases: [toronto, waterloo]
    boards: {location: "Toronto, ON", country_indeed: canada, sites: [linkedin, indeed, google]}
    amazon_country: CAN
  - key: london
    name: London
    priority: 3
    aliases: [london]
    boards: {location: "London, UK", country_indeed: uk, sites: [linkedin, indeed, glassdoor, google]}
    amazon_country: GBR
  - key: amsterdam
    name: Amsterdam
    priority: 3
    aliases: [amsterdam, amstelveen, netherlands, rotterdam, utrecht]
    boards: {location: "Amsterdam", country_indeed: netherlands, sites: [linkedin, indeed, google]}
  - key: india_launchpad
    name: India (US-multinational launchpad for an L-1A move)
    priority: 3
    aliases: [bengaluru, bangalore, gurugram, gurgaon, mumbai, hyderabad, delhi, noida, india]
    # Only keep India roles at companies listed in companies.yaml with `us_mnc: true`.
    require_us_mnc: true
    boards: {location: "Bengaluru, India", country_indeed: india, sites: [linkedin, indeed, naukri, google]}
    amazon_country: IND

# Words that suggest a consumer (B2C) vs. business (B2B) product; used in the rule-based pre-score.
b2c_signals:
  consumer: ['\bconsumers?\b', '\bb2c\b', 'millions of (users|customers|members|players|shoppers)', '\bmarketplace\b', 'e-?commerce', '\bshoppers\b', '\bsubscribers\b', '\bcreators\b', '\bgam(es|ing|ers)\b', '\bplayers\b', '\bcheckout\b', '\bd2c\b', '\bretail\b', 'mobile app']
  business: ['\bb2b\b', '\bsaas\b', '\benterprise\b', '\bprocurement\b', 'developer platform', '\bapi platform\b', '\berp\b', '\bcrm\b', '\bcybersecurity\b', 'data infrastructure']

# Companies to always drop (e.g. your current employer). Your private profile.yaml can add more.
exclude_companies: []

# Drop postings older than this many days (when the source reports a date).
max_age_days: 30

sources:
  ats:
    enabled: true            # Greenhouse / Lever / Ashby / SmartRecruiters / Workday boards in companies.yaml
  amazon:
    enabled: true
    search_terms: ["director", "head of", "general manager", "vice president", "principal product manager", "senior manager", "strategy", "business development"]
  boards:
    enabled: true            # needs `pip install -e ".[boards]"`; LinkedIn throttles datacenter IPs — run from home
    search_terms: ["Director of Product", "Head of Product", "VP Product", "General Manager", "Head of Business", "Head of Strategy", "Principal Product Manager", "Business Operations Lead"]
    results_per_query: 25
    hours_old: 72
    pause_seconds: 4
  posts:
    enabled: true            # LinkedIn "we're hiring" posts via Claude web search (needs ANTHROPIC_API_KEY)
    regions: [bay_area, seattle, singapore, new_york, dubai]
    lookback_days: 14
    max_searches_per_region: 5

# Keyword searches for boards that support search (Workday, SmartRecruiters).
keyword_search_terms: ["director", "head of", "vice president", "general manager", "chief", "principal", "strategy", "business operations", "senior product manager"]

scoring:
  effort: medium             # Claude effort for each job assessment: low | medium | high
  concurrency: 4
  max_per_run: 150           # cap Claude calls per run; best rule-scored jobs first
  min_rule_score: 30         # jobs below this pre-score are stored but not sent to Claude

digest:
  min_fit_score: 50          # hide scored jobs below this from the digest
  max_items: 40
