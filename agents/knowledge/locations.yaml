# Candidate cities for Compass. Planning estimates as of October 2026 — edit freely.
#
# comp_band_usd:   typical total comp (base + bonus + equity) for Director / Head-of-Product / GM roles
#                  at consumer-tech companies in that city.
# family_cost_usd: yearly run-rate for a family of three plus two parents (living with you, or visiting
#                  ~6 months a year where they can't live with you): renting a 3-4 bedroom home in a
#                  strong school district, preschool/school, health insurance incl. parents, food,
#                  transport, two trips to India.
# scores:          0-10 judgments on each criterion; weights live under `weights`.

as_of: 2026-10

# USD value of one unit of each currency (approximate, Oct 2026).
fx_to_usd:
  USD: 1.0
  EUR: 1.16
  GBP: 1.34
  CAD: 0.72
  SGD: 0.78
  AED: 0.2723
  INR: 0.0113
  CHF: 1.25

criteria:
  comp: Pay ceiling for the target level
  career: Access to top consumer-internet roles and a path to VP/GM/CEO
  startup: Capital, talent and network for founding a company later
  parents: Can dependent parents live with you long-term?
  residency: Speed and certainty of permanent residency / citizenship
  schools: School quality and access
  healthcare: Healthcare quality and access
  nature: Nature and outdoor life
  safety: Personal safety
  india_proximity: Ease of flying back to India

# Default weights reflect the user's stated priorities; override per question in Compass.
weights:
  comp: 0.20
  career: 0.20
  startup: 0.10
  parents: 0.15
  residency: 0.05
  schools: 0.10
  healthcare: 0.08
  nature: 0.05
  safety: 0.04
  india_proximity: 0.03

locations:
  bay_area:
    name: San Francisco Bay Area
    aliases: [sf, san francisco, bay area, silicon valley, palo alto, mountain view, menlo park]
    currency: USD
    tax: us:CA
    comp_band_usd: [380000, 700000]
