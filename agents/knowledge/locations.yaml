    scores: {comp: 10, career: 10, startup: 10, parents: 4, residency: 4, schools: 8, healthcare: 8, nature: 9, safety: 6, india_proximity: 2}
    work_visa: L-1A (via a US multinational's office abroad), H-1B (wage-weighted lottery), O-1A
    residency_path: EB-1C / EB-1A green card (~3.5-4 yr queue for India-born), citizenship 5 yrs later
    parents: Visitor visas (B-1/B-2, up to ~6 months per visit) until you are a US citizen; then immediate sponsorship
    schools: Excellent public districts (Cupertino, Palo Alto, Saratoga, Los Gatos) but $2.5M+ homes
    healthcare: World-class; depends on employer insurance
    nature: Coast, redwoods, Tahoe, Yosemite
    employers: [Meta, Google, Apple, Airbnb, Uber, DoorDash, Instacart, Pinterest, Reddit, Discord, Robinhood, OpenAI, Anthropic, Netflix]
